# Horus .testenv/manifest.yaml
# First real consumer of testenv/v1 — end-to-end proof of the design.
# Slot/path/project contract per design ee2d53d2:
#  - acquire OWNS slot assignment and emits {slot, slot_data_path, project,
#    ports} as JSON; the runner discovers it (no caller-imposed --slot).
#  - {slot}            → bare slot id (e.g. 0); used for the docker project.
#  - {slot_data_path}  → absolute slot data dir (e.g. …/test-env/slot-0).
#  - {workdir}/{src}   → repo clone/build dir vs source repo.
# The spike-discovered host-prep workarounds (chown UID-1001, forge-registry
# git init, neo4j/typesense chmod) now live in the CLI's acquire/createSlotDirs
# path — the manifest no longer carries them. Design ref: ee2d53d2 / b53213ec.

apiVersion: testenv/v1
repo: horus

requires:
  secrets:
    - ANTHROPIC_API_KEY            # required by the Claude Code agent (T5-style runs)
    # reader-server only — required only when the reader is under test (full profile)
    - name: CURSOR_API_KEY
      profiles: [full]
  profiles:
    laptop:
      mem: 6g
    cloud:
      mem: 12g
    full:
      mem: 12g

# ---------------------------------------------------------------------------
# MCP connection topology — declares named endpoints the test actions target.
# Template vars ({port_*}) are populated at runtime from acquire --json output.
# ---------------------------------------------------------------------------
connections:
  shadow:
    anvil: { transport: sse, url: "http://localhost:{port_anvil_dev}/mcp" }
    vault: { transport: sse, url: "http://localhost:{port_vault_dev}/mcp" }
    forge: { transport: sse, url: "http://localhost:{port_forge_dev}/mcp" }
  live:
    anvil: { transport: sse, url: "http://localhost:{port_anvil}/mcp" }

phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — setup
  # Clone the repo under test into an isolated workdir and build it. Host/slot
  # preparation is owned by `horus test-env acquire` (launch phase), not here.
  # ---------------------------------------------------------------------------
  setup:
    steps:
      # Clone without hard-links: kernel protected_hardlinks rejects --local
      # when source files are container-owned (spike 676a5057 bug #7).
      - run: git clone --no-hardlinks {src} {workdir}
        label: Clone repo (no-hardlinks)

      # Install deps, then build the testenv toolchain (the change surface
      # this .testenv exercises). Scoped, not `pnpm -r build`: a full-monorepo
      # build is slow and pulls in unrelated packages whose clean-clone build
      # ordering is a separate concern, out of scope for the testing flow.
      # pnpm filter flags MUST precede the script name; placed after, they are
      # passed as args to the package build (tsup) and rejected.
      - run: pnpm install && pnpm --filter @akhera-horus/testenv --filter @akhera-horus/testenv-runner --filter @arkhera30/cli build
        label: Install dependencies and build testenv toolchain

    # No cmd_exit_zero assert here: it would redundantly re-run the build the
    # step above already performed, under runner-core's 30s/1MB execSync caps —
    # pure flake surface. The build step succeeding IS the setup validation.

    isolationChecks:
      disjointDockerProject: true
      disjointDockerNetworks: true
      disjointDockerVolumes: true
      disjointPortSpace: true
      disjointDataDir: true
      allRequiredSecretsPresent: true

  # ---------------------------------------------------------------------------
  # Phase 2 — launch
  # Provision the isolated stack. `acquire` auto-assigns the slot and emits a
  # JSON object on stdout; the runner parses it into {slot},
  # {slot_data_path}, {project}, {port_*}. --standalone generates a
  # fully-projected compose file (no port-merge overlay).
  # ---------------------------------------------------------------------------
  launch:
    provisioner: "horus test-env acquire --standalone --json"

    assert:
      # The --standalone stack is exactly 7 long-running services:
      # anvil, vault-mcp, vault-router, vault-personal, forge, neo4j, typesense.
      # (reader/reader-server are NOT part of the standalone topology — they are
      # profile-gated and excluded here; see DQ4.)
      - type: containers_running
        count: 7

      - type: ports_disjoint_from_live
        value: true

      - type: docker_project_name
        pattern: "{project}"

      - type: fully_projected_ports
        value: true

    isolationChecks:
      distinctDockerProject: true
      fullyProjectedPorts: true
      connectionManifestEmitted: true

  # ---------------------------------------------------------------------------
  # Phase 3 — await_ready
  # Poll the MCP endpoints until all are up. MCP is plain JSON-RPC HTTP — no
  # model/API key needed (spike a19c19a9 T4). The reader-server is launched as
  # part of the stack but is profile-gated (full) and not a readiness probe
  # here — it is not under test in laptop/cloud (design ee2d53d2 DQ4).
  # ---------------------------------------------------------------------------
  await_ready:
    poll:
      - probe: anvil_list_types
        expect: returns_type_registry

      - probe: knowledge_get_schema
        expect: returns_page_types

      - probe: forge_repo_list
        expect: ok

    timeout: 180
    interval: 5

  # ---------------------------------------------------------------------------
  # Phase 4 — connection
  # acquire writes claude-settings.json into the slot data dir; assert it
  # parses cleanly and carries -dev-suffixed MCP server names (spike 676a5057
  # T3/T4: anvil-dev, vault-dev, forge-dev — no collision with live).
  # ---------------------------------------------------------------------------
  connection:
    emit: "{slot_data_path}/claude-settings.json"

    assert:
      - type: file_parses
        path: "{slot_data_path}/claude-settings.json"
        format: json

      - type: mcp_names_suffixed
        suffix: "-dev"

  # ---------------------------------------------------------------------------
  # Phase 5 — test
  # Includes the promoted spike-T2 isolation-proof assertion:
  # data written via shadow MCP must NOT appear in the live stack.
  # Actions declare their MCP target via `connection:` (see connections block).
  # runner-core reports these as `delegated`; the sdlc-testenv agent executes them.
  # ---------------------------------------------------------------------------
  test:
    # run-all (not fail-fast): this is a feature-coverage matrix — we want every
    # service's results in one pass, not an abort at the first red. Each action is
    # self-contained (round-trips live inside a single `sequence`) so parallel
    # execution under `concurrency` is safe; no cross-action ordering dependency.
    policy: run-all

    actions:
      # Basic Anvil round-trip: create a note via shadow MCP, confirm it lands.
      - name: anvil-roundtrip
        connection: shadow.anvil
        invoke:
          tool: anvil_create_note
          args:
            title: "testenv-check"
        expect:
          returns: note_id
        evidence:
          capture: response
          extract: noteId
          saveTo: evidence/anvil-roundtrip.json

      # Promoted spike-T2 isolation proof: the live Anvil search must return
      # zero results for the note title written above into the shadow stack.
      # (Previously invoke.http: "live-anvil/search" — but Anvil is MCP-only,
      # no REST endpoint. Rewritten to invoke.tool with connection: live.anvil.)
      - name: isolation-proof
        connection: live.anvil
        invoke:
          tool: anvil_search
          args:
            query: "testenv-check"
        expect:
          count: 0
        evidence:
          capture: response
          saveTo: evidence/isolation-proof.json

      # =======================================================================
      # FEATURE COVERAGE — Forge, Vault, Anvil (stack-level, agent-delegated).
      # Each action calls a real MCP tool against the isolated SHADOW stack via
      # its `connection:`. runner-core marks `tool:` actions `delegated`; the
      # sdlc-testenv executor performs the call over MCP and checks `expect`.
      #
      # Convention for round-trips: multi-step flows use `sequence` so create →
      # read → mutate → delete is ONE self-contained action (no cross-action
      # ordering dependency under run-all). Server-generated IDs are threaded
      # between steps with `{{step.field}}` placeholders — the runner does NOT
      # expand these (only {slot}/{workdir} etc. are runner template vars); the
      # executor substitutes the real value captured from the prior step's
      # response. State created here lives only in the ephemeral shadow stack
      # and is removed by teardown, but round-trips clean up after themselves.
      #
      # Heavy / externally-dependent / irreversible tools are intentionally out
      # of this breadth pass: forge_develop (clones a repo), forge_publish /
      # forge_add / forge_install (mutate the shared registry), knowledge_write_page
      # (opens a real git PR). Add these later behind a dedicated profile.
      # =======================================================================

      # ----- FORGE: artifact registry (read path) ----------------------------
      - name: forge-artifact-search
        connection: shadow.forge
        invoke:
          tool: forge_search
          args:
            query: "sdlc"
        expect:
          returns: results
        evidence:
          capture: response
          saveTo: evidence/forge-artifact-search.json
        tags: [feature, forge, registry, search]

      - name: forge-artifact-resolve
        connection: shadow.forge
        invoke:
          tool: forge_resolve
          args:
            ref: "workspace-config:sdlc-default"
        expect:
          returns: version
        tags: [feature, forge, registry, resolve]

      - name: forge-artifact-list-available
        connection: shadow.forge
        invoke:
          tool: forge_list
          args:
            scope: "available"
        expect:
          returns: artifacts
        tags: [feature, forge, registry, list]

      # ----- FORGE: workspace lifecycle (create -> status -> delete) ----------
      - name: forge-workspace-lifecycle
        connection: shadow.forge
        invoke:
          sequence:
            - name: create
              invoke:
                tool: forge_workspace_create
                args:
                  config: "sdlc-default"
                  name: "testenv-feature-ws"
              expect:
                returns: workspace_id
            - name: status
              invoke:
                tool: forge_workspace_status
                args:
                  id: "{{create.workspace.id}}"
              expect:
                returns: status
            - name: list-contains
              invoke:
                tool: forge_workspace_list
                args: {}
              expect:
                contains: "testenv-feature-ws"
            - name: delete
              invoke:
                tool: forge_workspace_delete
                args:
                  id: "{{create.workspace.id}}"
                  force: true
              expect:
                returns: success
        evidence:
          capture: response
          saveTo: evidence/forge-workspace-lifecycle.json
        tags: [feature, forge, workspace, lifecycle]

      # ----- FORGE: repo index (read + register round-trip) -------------------
      - name: forge-repo-list
        connection: shadow.forge
        invoke:
          tool: forge_repo_list
          args: {}
        expect:
          returns: repos
        tags: [feature, forge, repo-index, list]

      - name: forge-repo-resolve
        connection: shadow.forge
        invoke:
          tool: forge_repo_resolve
          args:
            name: "Horus"
        # forge_repo_resolve wraps the hit in { match: { org, name, canonicalUrl, ... } }.
        # A registry-only entry has no localPath, so assert on the resolved name.
        expect:
          field: name
          equals: "Horus"
        tags: [feature, forge, repo-index, resolve]

      # NOTE: forge_repo_register / _get / _remove (write round-trip) are NOT
      # exercised here. In the isolated test-env the repo registry proxies to the
      # control-plane HTTP registry, which rejects writes with UNAUTHORIZED
      # (no Authorization header is carried into the shadow stack). Repo-index
      # *reads* (list/resolve) work because they hit the local cache. Add the
      # register round-trip behind an authenticated profile later.

      # ----- FORGE: code sessions (read) --------------------------------------
      - name: forge-session-list
        connection: shadow.forge
        invoke:
          tool: forge_session_list
          args: {}
        expect:
          returns: sessions
        tags: [feature, forge, session, list]

      # ----- VAULT: knowledge service (read / validate / suggest) -------------
      # Content-dependent reads (get_page by UUID, graph edges, write_page PR)
      # need a seeded vault and are intentionally excluded — these exercise the
      # endpoints' shape and validation behaviour, which hold on an empty vault.
      - name: vault-schema
        connection: shadow.vault
        invoke:
          tool: knowledge_get_schema
          args: {}
        expect:
          returns: page_types
        tags: [feature, vault, schema]

      - name: vault-search
        connection: shadow.vault
        invoke:
          tool: knowledge_search
          args:
            query: "anvil"
            limit: 5
        expect:
          returns: results
        evidence:
          capture: response
          saveTo: evidence/vault-search.json
        tags: [feature, vault, search]

      - name: vault-resolve-context
        connection: shadow.vault
        invoke:
          tool: knowledge_resolve_context
          args:
            repo: "anvil"
            include_full: false
        expect:
          returns: operational_pages
        tags: [feature, vault, resolve-context]

      - name: vault-list-by-scope
        connection: shadow.vault
        invoke:
          tool: knowledge_list_by_scope
          args:
            scope: { program: "horus" }
            limit: 10
        expect:
          returns: pages
        tags: [feature, vault, list-by-scope]

      - name: vault-validate-page-valid
        connection: shadow.vault
        invoke:
          tool: knowledge_validate_page
          args:
            content: |
              ---
              title: Testenv Feature Page
              type: guide
              mode: reference
              description: A well-formed guide page used to assert the validator accepts valid input.
              scope:
                program: horus
              ---

              # Testenv Feature Page

              A well-formed page used to assert the validator accepts valid input.
        expect:
          field: valid
          equals: true
        tags: [feature, vault, validate]

      - name: vault-validate-page-invalid
        connection: shadow.vault
        invoke:
          tool: knowledge_validate_page
          args:
            content: |
              ---
              type: not-a-real-type
              ---

              # Missing required frontmatter
        expect:
          field: valid
          equals: false
        tags: [feature, vault, validate, negative]

      - name: vault-suggest-metadata
        connection: shadow.vault
        invoke:
          tool: knowledge_suggest_metadata
          args:
            content: |
              # Deploying the Forge Registry

              Steps to provision the registry on EC2 with CloudFront and S3.
        expect:
          returns: suggestions
        tags: [feature, vault, suggest-metadata]

      - name: vault-check-duplicates
        connection: shadow.vault
        invoke:
          tool: knowledge_check_duplicates
          args:
            title: "A Definitely Novel Testenv Topic"
            content: "Unique content that should not match any existing vault page."
        expect:
          returns: novel
        tags: [feature, vault, check-duplicates]

      # ----- ANVIL: types + note CRUD round-trip ------------------------------
      - name: anvil-list-types
        connection: shadow.anvil
        invoke:
          tool: anvil_list_types
          args: {}
        expect:
          returns: types
        tags: [feature, anvil, types]

      - name: anvil-note-crud
        connection: shadow.anvil
        invoke:
          sequence:
            - name: create
              invoke:
                tool: anvil_create_note
                args:
                  type: "note"
                  title: "testenv-feature-note"
                  body: "initial body"
              expect:
                returns: noteId
            - name: get
              invoke:
                tool: anvil_get_note
                args:
                  noteId: "{{create.noteId}}"
              expect:
                field: title
                equals: "testenv-feature-note"
            - name: update
              invoke:
                tool: anvil_update_note
                args:
                  noteId: "{{create.noteId}}"
                  body: "updated body"
              expect:
                returns: noteId
            - name: delete
              invoke:
                tool: anvil_delete_note
                args:
                  noteId: "{{create.noteId}}"
                  force: true
              expect:
                returns: deleted
        evidence:
          capture: response
          saveTo: evidence/anvil-note-crud.json
        tags: [feature, anvil, note, crud]

      # ----- ANVIL: views (table + board) -------------------------------------
      - name: anvil-query-view-table
        connection: shadow.anvil
        invoke:
          tool: anvil_query_view
          args:
            view: "table"
            filters: { type: "task" }
            limit: 10
        # table view returns { columns, rows }; board view returns { items }.
        expect:
          returns: rows
        tags: [feature, anvil, view, table]

      - name: anvil-query-view-board
        connection: shadow.anvil
        invoke:
          tool: anvil_query_view
          args:
            view: "board"
            groupBy: "status"
            filters: { type: "task" }
        expect:
          returns: items
        tags: [feature, anvil, view, board]

      - name: anvil-search
        connection: shadow.anvil
        invoke:
          tool: anvil_search
          args:
            query: "feature"
            limit: 5
        expect:
          returns: results
        tags: [feature, anvil, search]

      # ----- ANVIL: graph — entity + edge round-trip --------------------------
      - name: anvil-entity-edge-graph
        connection: shadow.anvil
        invoke:
          sequence:
            - name: create-a
              invoke:
                tool: anvil_create_entity
                args:
                  type: "note"
                  title: "testenv-feature-entity-A"
              expect:
                returns: entityId
            - name: create-b
              invoke:
                tool: anvil_create_entity
                args:
                  type: "note"
                  title: "testenv-feature-entity-B"
              expect:
                returns: entityId
            - name: link
              invoke:
                tool: anvil_create_edge
                args:
                  sourceId: "{{create-a.entityId}}"
                  targetId: "{{create-b.entityId}}"
                  intent: "references"
              expect:
                returns: intent
            - name: get-edges
              invoke:
                tool: anvil_get_edges
                args:
                  noteId: "{{create-a.entityId}}"
              expect:
                returns: edges
            - name: get-related
              invoke:
                tool: anvil_get_related
                args:
                  noteId: "{{create-a.entityId}}"
              expect:
                returns: forward
            - name: unlink
              invoke:
                tool: anvil_delete_edge
                args:
                  sourceId: "{{create-a.entityId}}"
                  targetId: "{{create-b.entityId}}"
              expect:
                returns: deleted
            - name: delete-a
              invoke:
                tool: anvil_delete_entity
                args:
                  noteId: "{{create-a.entityId}}"
                  force: true
              expect:
                returns: deleted
            - name: delete-b
              invoke:
                tool: anvil_delete_entity
                args:
                  noteId: "{{create-b.entityId}}"
                  force: true
              expect:
                returns: deleted
        evidence:
          capture: response
          saveTo: evidence/anvil-entity-edge-graph.json
        tags: [feature, anvil, graph, edge]

      # ----- ANVIL: hierarchy — parent_of + children/subtree -----------------
      - name: anvil-hierarchy
        connection: shadow.anvil
        invoke:
          sequence:
            - name: create-parent
              invoke:
                tool: anvil_create_entity
                args:
                  type: "project"
                  title: "testenv-feature-parent"
                  fields: { status: "active" }
              expect:
                returns: entityId
            - name: create-child
              invoke:
                tool: anvil_create_entity
                args:
                  type: "task"
                  title: "testenv-feature-child"
                  fields: { status: "open" }
              expect:
                returns: entityId
            - name: link-parent-of
              invoke:
                tool: anvil_create_edge
                args:
                  sourceId: "{{create-parent.entityId}}"
                  targetId: "{{create-child.entityId}}"
                  intent: "parent_of"
              expect:
                returns: intent
            - name: get-children
              invoke:
                tool: anvil_get_children
                args:
                  entityId: "{{create-parent.entityId}}"
              expect:
                contains: "testenv-feature-child"
            - name: get-subtree
              invoke:
                tool: anvil_get_subtree
                args:
                  entityId: "{{create-parent.entityId}}"
              expect:
                returns: descendants
            - name: delete-child
              invoke:
                tool: anvil_delete_entity
                args:
                  noteId: "{{create-child.entityId}}"
                  force: true
              expect:
                returns: deleted
            - name: delete-parent
              invoke:
                tool: anvil_delete_entity
                args:
                  noteId: "{{create-parent.entityId}}"
                  force: true
              expect:
                returns: deleted
        tags: [feature, anvil, graph, hierarchy]

      # -----------------------------------------------------------------------
      # F1 @horus/auth — pure unit/type actions (needsStack: false, Design E3).
      # The runner skips setup/launch/await_ready/connection for these and runs
      # them in-process: a JWT/JWKS library needs no Docker stack. One action
      # per acceptance criterion; assertions live in packages/auth/test/.
      # -----------------------------------------------------------------------
      - name: auth-ac1-surface
        invoke:
          run: "pnpm --filter @horus/auth exec vitest run test/ac1-surface.test.ts"
        expect:
          exitCode: 0
        needsStack: false
        tags: [unit, auth, F1, AC-1]

      - name: auth-ac2-offline-verify
        invoke:
          run: "pnpm --filter @horus/auth exec vitest run test/ac2-offline-verify.test.ts"
        expect:
          exitCode: 0
        needsStack: false
        tags: [unit, auth, F1, AC-2]

      - name: auth-ac3-headless-refresh
        invoke:
          run: "pnpm --filter @horus/auth exec vitest run test/ac3-headless-refresh.test.ts"
        expect:
          exitCode: 0
        needsStack: false
        tags: [unit, auth, F1, AC-3]

      - name: auth-ac4-tenant-floor
        invoke:
          run: "pnpm --filter @horus/auth exec vitest run test/ac4-tenant-floor.test.ts"
        expect:
          exitCode: 0
        needsStack: false
        tags: [unit, auth, F1, AC-4]

      - name: auth-ac5-shim
        invoke:
          run: "pnpm --filter @horus/auth exec vitest run test/ac5-shim.test.ts"
        expect:
          exitCode: 0
        needsStack: false
        tags: [unit, auth, F1, AC-5]

      # -----------------------------------------------------------------------
      # F2 @horus/scope — pure unit/type actions (needsStack: false, Design E3).
      # Scope-chain resolver + DeploymentProfile config module; no Docker stack.
      # -----------------------------------------------------------------------
      - name: scope-ac1-resolver
        invoke:
          run: "pnpm --filter @horus/scope exec vitest run test/ac1-resolver.test.ts"
        expect:
          exitCode: 0
        needsStack: false
        tags: [unit, scope, F2, AC-1]

      - name: scope-ac2-profile-schema
        invoke:
          run: "pnpm --filter @horus/scope exec vitest run test/ac2-profile-schema.test.ts"
        expect:
          exitCode: 0
        needsStack: false
        tags: [unit, scope, F2, AC-2]

      - name: scope-ac3-tier-optionality
        invoke:
          run: "pnpm --filter @horus/scope exec vitest run test/ac3-tier-optionality.test.ts"
        expect:
          exitCode: 0
        needsStack: false
        tags: [unit, scope, F2, AC-3]

      - name: scope-ac4-readme
        invoke:
          run: "pnpm --filter @horus/scope exec vitest run test/ac4-readme.test.ts"
        expect:
          exitCode: 0
        needsStack: false
        tags: [unit, scope, F2, AC-4]

      # -----------------------------------------------------------------------
      # F3 @horus/tenancy — pure unit/type actions (needsStack: false, E3).
      # Per-user Anvil tenancy contract; validated against F1+F2; no stack.
      # -----------------------------------------------------------------------
      - name: tenancy-ac1-contract-scaffolding
        invoke:
          run: "pnpm --filter @horus/tenancy exec vitest run test/ac1-contract-scaffolding.test.ts"
        expect:
          exitCode: 0
        needsStack: false
        tags: [unit, tenancy, F3, AC-1]

      - name: tenancy-ac2-provisioning-steplist
        invoke:
          run: "pnpm --filter @horus/tenancy exec vitest run test/ac2-provisioning-steplist.test.ts"
        expect:
          exitCode: 0
        needsStack: false
        tags: [unit, tenancy, F3, AC-2]

      - name: tenancy-ac3-schema-bootstrap-ownership
        invoke:
          run: "pnpm --filter @horus/tenancy exec vitest run test/ac3-schema-bootstrap-ownership.test.ts"
        expect:
          exitCode: 0
        needsStack: false
        tags: [unit, tenancy, F3, AC-3]

      - name: tenancy-ac4-validated-f1-f2
        invoke:
          run: "pnpm --filter @horus/tenancy exec vitest run test/ac4-validated-f1-f2.test.ts"
        expect:
          exitCode: 0
        needsStack: false
        tags: [unit, tenancy, F3, AC-4]

  # ---------------------------------------------------------------------------
  # Phase 6 — teardown
  # Release the slot discovered at launch, then run detective isolation
  # assertions confirming no test containers remain, the live stack is
  # unmodified and free of test artifacts, and no secret residue leaked.
  # ---------------------------------------------------------------------------
  teardown:
    provisioner: "horus test-env release --slot {slot}"

    assert:
      - type: containers_remaining
        count: 0

      - type: live_stack_unmodified
        value: true

      - type: live_data_test_artifacts_zero
        value: true

      - type: no_secret_residue
        value: true

    isolationChecks:
      liveStackUnmodified: true
      liveDataTestArtifactsZero: true
      noSecretResidue: true
