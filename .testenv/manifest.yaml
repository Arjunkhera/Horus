# Horus .testenv/manifest.yaml
# First real consumer of testenv/v1 — end-to-end proof of the design.
# Slot/path/project contract per design ee2d53d2:
#  - acquire OWNS slot assignment and emits {slot, slot_data_path, project,
#    ports} as JSON; the runner discovers it (no caller-imposed --slot).
#  - {slot}            → bare slot id (e.g. 0); used for the docker project.
#  - {slot_data_path}  → absolute slot data dir (e.g. …/test-env/slot-0).
#  - {workdir}/{src}   → repo clone/build dir vs source repo.
# The spike-discovered host-prep workarounds (chown UID-1001, forge-registry
# git init, neo4j/typesense chmod) now live in the CLI's acquire/createSlotDirs
# path — the manifest no longer carries them. Design ref: ee2d53d2 / b53213ec.

apiVersion: testenv/v1
repo: horus

requires:
  secrets:
    - ANTHROPIC_API_KEY            # required by the Claude Code agent (T5-style runs)
    # reader-server only — required only when the reader is under test (full profile)
    - name: CURSOR_API_KEY
      profiles: [full]
  profiles:
    laptop:
      mem: 6g
    cloud:
      mem: 12g
    full:
      mem: 12g

# ---------------------------------------------------------------------------
# MCP connection topology — declares named endpoints the test actions target.
# Template vars ({port_*}) are populated at runtime from acquire --json output.
# ---------------------------------------------------------------------------
connections:
  shadow:
    anvil: { transport: sse, url: "http://localhost:{port_anvil_dev}/mcp" }
    vault: { transport: sse, url: "http://localhost:{port_vault_dev}/mcp" }
    forge: { transport: sse, url: "http://localhost:{port_forge_dev}/mcp" }
  live:
    anvil: { transport: sse, url: "http://localhost:{port_anvil}/mcp" }

phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — setup
  # Clone the repo under test into an isolated workdir and build it. Host/slot
  # preparation is owned by `horus test-env acquire` (launch phase), not here.
  # ---------------------------------------------------------------------------
  setup:
    steps:
      # Clone without hard-links: kernel protected_hardlinks rejects --local
      # when source files are container-owned (spike 676a5057 bug #7).
      - run: git clone --no-hardlinks {src} {workdir}
        label: Clone repo (no-hardlinks)

      # Install deps, then build the testenv toolchain (the change surface
      # this .testenv exercises). Scoped, not `pnpm -r build`: a full-monorepo
      # build is slow and pulls in unrelated packages whose clean-clone build
      # ordering is a separate concern, out of scope for the testing flow.
      # pnpm filter flags MUST precede the script name; placed after, they are
      # passed as args to the package build (tsup) and rejected.
      - run: pnpm install && pnpm --filter @akhera-horus/testenv --filter @akhera-horus/testenv-runner --filter @arkhera30/cli build
        label: Install dependencies and build testenv toolchain

    # No cmd_exit_zero assert here: it would redundantly re-run the build the
    # step above already performed, under runner-core's 30s/1MB execSync caps —
    # pure flake surface. The build step succeeding IS the setup validation.

    isolationChecks:
      disjointDockerProject: true
      disjointDockerNetworks: true
      disjointDockerVolumes: true
      disjointPortSpace: true
      disjointDataDir: true
      allRequiredSecretsPresent: true

  # ---------------------------------------------------------------------------
  # Phase 2 — launch
  # Provision the isolated stack. `acquire` auto-assigns the slot and emits a
  # JSON object on stdout; the runner parses it into {slot},
  # {slot_data_path}, {project}, {port_*}. --standalone generates a
  # fully-projected compose file (no port-merge overlay).
  # ---------------------------------------------------------------------------
  launch:
    provisioner: "horus test-env acquire --standalone --json"

    assert:
      # The --standalone stack is exactly 7 long-running services:
      # anvil, vault-mcp, vault-router, vault-personal, forge, neo4j, typesense.
      # (reader/reader-server are NOT part of the standalone topology — they are
      # profile-gated and excluded here; see DQ4.)
      - type: containers_running
        count: 7

      - type: ports_disjoint_from_live
        value: true

      - type: docker_project_name
        pattern: "{project}"

      - type: fully_projected_ports
        value: true

    isolationChecks:
      distinctDockerProject: true
      fullyProjectedPorts: true
      connectionManifestEmitted: true

  # ---------------------------------------------------------------------------
  # Phase 3 — await_ready
  # Poll the MCP endpoints until all are up. MCP is plain JSON-RPC HTTP — no
  # model/API key needed (spike a19c19a9 T4). The reader-server is launched as
  # part of the stack but is profile-gated (full) and not a readiness probe
  # here — it is not under test in laptop/cloud (design ee2d53d2 DQ4).
  # ---------------------------------------------------------------------------
  await_ready:
    poll:
      - probe: anvil_list_types
        expect: returns_type_registry

      - probe: knowledge_get_schema
        expect: returns_page_types

      - probe: forge_repo_list
        expect: ok

    timeout: 180
    interval: 5

  # ---------------------------------------------------------------------------
  # Phase 4 — connection
  # acquire writes claude-settings.json into the slot data dir; assert it
  # parses cleanly and carries -dev-suffixed MCP server names (spike 676a5057
  # T3/T4: anvil-dev, vault-dev, forge-dev — no collision with live).
  # ---------------------------------------------------------------------------
  connection:
    emit: "{slot_data_path}/claude-settings.json"

    assert:
      - type: file_parses
        path: "{slot_data_path}/claude-settings.json"
        format: json

      - type: mcp_names_suffixed
        suffix: "-dev"

  # ---------------------------------------------------------------------------
  # Phase 5 — test
  # Includes the promoted spike-T2 isolation-proof assertion:
  # data written via shadow MCP must NOT appear in the live stack.
  # Actions declare their MCP target via `connection:` (see connections block).
  # runner-core reports these as `delegated`; the sdlc-testenv agent executes them.
  # ---------------------------------------------------------------------------
  test:
    policy: fail-fast

    actions:
      # Basic Anvil round-trip: create a note via shadow MCP, confirm it lands.
      - name: anvil-roundtrip
        connection: shadow.anvil
        invoke:
          tool: anvil_create_note
          args:
            title: "testenv-check"
        expect:
          returns: note_id
        evidence:
          capture: response
          extract: noteId
          saveTo: evidence/anvil-roundtrip.json

      # Promoted spike-T2 isolation proof: the live Anvil search must return
      # zero results for the note title written above into the shadow stack.
      # (Previously invoke.http: "live-anvil/search" — but Anvil is MCP-only,
      # no REST endpoint. Rewritten to invoke.tool with connection: live.anvil.)
      - name: isolation-proof
        connection: live.anvil
        invoke:
          tool: anvil_search
          args:
            query: "testenv-check"
        expect:
          count: 0
        evidence:
          capture: response
          saveTo: evidence/isolation-proof.json

      # -----------------------------------------------------------------------
      # F1 @horus/auth — pure unit/type actions (needsStack: false, Design E3).
      # The runner skips setup/launch/await_ready/connection for these and runs
      # them in-process: a JWT/JWKS library needs no Docker stack. One action
      # per acceptance criterion; assertions live in packages/auth/test/.
      # -----------------------------------------------------------------------
      - name: auth-ac1-surface
        invoke:
          run: "pnpm --filter @horus/auth exec vitest run test/ac1-surface.test.ts"
        expect:
          exitCode: 0
        needsStack: false
        tags: [unit, auth, F1, AC-1]

      - name: auth-ac2-offline-verify
        invoke:
          run: "pnpm --filter @horus/auth exec vitest run test/ac2-offline-verify.test.ts"
        expect:
          exitCode: 0
        needsStack: false
        tags: [unit, auth, F1, AC-2]

      - name: auth-ac3-headless-refresh
        invoke:
          run: "pnpm --filter @horus/auth exec vitest run test/ac3-headless-refresh.test.ts"
        expect:
          exitCode: 0
        needsStack: false
        tags: [unit, auth, F1, AC-3]

      - name: auth-ac4-tenant-floor
        invoke:
          run: "pnpm --filter @horus/auth exec vitest run test/ac4-tenant-floor.test.ts"
        expect:
          exitCode: 0
        needsStack: false
        tags: [unit, auth, F1, AC-4]

      - name: auth-ac5-shim
        invoke:
          run: "pnpm --filter @horus/auth exec vitest run test/ac5-shim.test.ts"
        expect:
          exitCode: 0
        needsStack: false
        tags: [unit, auth, F1, AC-5]

  # ---------------------------------------------------------------------------
  # Phase 6 — teardown
  # Release the slot discovered at launch, then run detective isolation
  # assertions confirming no test containers remain, the live stack is
  # unmodified and free of test artifacts, and no secret residue leaked.
  # ---------------------------------------------------------------------------
  teardown:
    provisioner: "horus test-env release --slot {slot}"

    assert:
      - type: containers_remaining
        count: 0

      - type: live_stack_unmodified
        value: true

      - type: live_data_test_artifacts_zero
        value: true

      - type: no_secret_residue
        value: true

    isolationChecks:
      liveStackUnmodified: true
      liveDataTestArtifactsZero: true
      noSecretResidue: true
