name: SDLC Story / Work Item Manager
version: 3.0.0
description: Create and manage work items with 7 subtypes (feature, bugfix, refactor, spike, hotfix,
  task, chore), ceremony levels, and a full state machine. The worktree CREATOR for the repo-local
