apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: horus-system

commonLabels:
  app.kubernetes.io/part-of: horus-control-plane
  app.kubernetes.io/component: forge

# Pinned image tag (ADR-0007 — never :latest).
# Re-pinned to sha-a3d7d23: rebuild() now UNCONDITIONALLY reconciles the Typesense
# index against storage on startup (PR #412, a3d7d23). The prior pin sha-aa74de7
# (PR #409) skipped reindex when doc count == artifact count, which a stale/phantom
# doc defeated (146==146 yet skill:sdlc-docs absent), so the partial index never
# healed. Always-upsert guarantees every stored artifact is indexed on each roll.
# Lineage: sha-f607219 added the S3-backed shared repo index (PR #361/#363).
images:
  - name: ghcr.io/arjunkhera/horus/forge-registry
    newTag: sha-a3d7d23

resources:
  - forge-registry.yaml
