apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: horus-system

commonLabels:
  app.kubernetes.io/part-of: horus-control-plane
  app.kubernetes.io/component: forge

# Pinned image tag (ADR-0007 — never :latest).
# Re-pinned to sha-aa74de7: self-healing Typesense reindex + surfaced publish
# index failures (PR #409, aa74de7). The prior pin sha-f607219 ran the buggy
# rebuild() that skipped whenever the index was non-empty, so a partial index
# (e.g. skill:sdlc-docs present in S3 but absent from Typesense) never recovered.
# This image reconciles the index against storage on startup, so rolling this
# deployment re-indexes the missing artifacts. Predecessor sha-f607219 added the
# S3-backed shared repo index (PR #361/#363).
images:
  - name: ghcr.io/arjunkhera/horus/forge-registry
    newTag: sha-aa74de7

resources:
  - forge-registry.yaml
