apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: horus-system

# SealedSecret manifests are committed here AFTER the cluster + sealed-secrets
# controller exist (they are encrypted against the controller's cluster key).
# See README.md for the exact sealing procedure. Until then this app is a no-op.
resources:
  - horus-service-secrets.sealed.yaml
  - horus-principal-pub.sealed.yaml
  - forge-registry-secrets.sealed.yaml
  - backup-credentials.sealed.yaml
  - grafana-admin.sealed.yaml
#  - vault-secrets.sealed.yaml   # added once the GitHub PAT is provided
