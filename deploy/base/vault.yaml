# Vault tier — Reader/Writer split (#8) realized as deployment topology.
#   vault-reader : stateless, N replicas, reads from Typesense + Neo4j (no git/PVC)
#   vault-writer : single replica, StatefulSet + PVC (sole git writer)
#   vault-router : routes reads→reader pool, writes→writer, per the vault-registry ConfigMap
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-reader
  labels:
    app.kubernetes.io/name: vault-reader
    app.kubernetes.io/component: vault
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vault-reader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-reader
    spec:
      enableServiceLinks: false
      # No git-init initContainer: entrypoint.sh clones the GitHub-backed knowledge
      # repo (derived from GITHUB_REPO in vault-secrets) into the emptyDir on start.
      # A pre-created empty .git would suppress that clone, leaving readers content-less.
      containers:
        - name: vault-reader
          image: ghcr.io/arjunkhera/horus/vault:0.1.0-alpha
          ports:
            - containerPort: 8000
          env:
            - name: VAULT_MODE
              value: reader
            - name: HORUS_PRINCIPAL_PUBLIC_JWK_FILE
              value: /etc/horus/principal/pub.jwk
          envFrom:
            - configMapRef:
                name: vault-config
            - secretRef:
                name: vault-secrets
          volumeMounts:
            - name: knowledge-data
              mountPath: /data
            - name: principal-pub
              mountPath: /etc/horus/principal
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: knowledge-data
          emptyDir: {}
        - name: principal-pub
          secret:
            secretName: horus-principal-pub
---
apiVersion: v1
kind: Service
metadata:
  name: vault-reader
  labels:
    app.kubernetes.io/name: vault-reader
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vault-reader
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault-writer
  labels:
    app.kubernetes.io/name: vault-writer
    app.kubernetes.io/component: vault
spec:
  serviceName: vault-writer
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault-writer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-writer
    spec:
      enableServiceLinks: false
      # No git-init initContainer: entrypoint.sh clones the GitHub-backed knowledge
      # repo (derived from GITHUB_REPO in vault-secrets) onto the PVC on first start
      # and pushes the _schema bootstrap. A pre-created empty .git would suppress the
      # clone. The PVC persists the checkout across restarts.
      containers:
        - name: vault-writer
          image: ghcr.io/arjunkhera/horus/vault:0.1.0-alpha
          ports:
            - containerPort: 8000
          env:
            - name: VAULT_MODE
              value: writer
            - name: KNOWLEDGE_REPO_PATH
              value: /data/knowledge-repo
            - name: HORUS_PRINCIPAL_PUBLIC_JWK_FILE
              value: /etc/horus/principal/pub.jwk
          envFrom:
            - configMapRef:
                name: vault-config
            - secretRef:
                name: vault-secrets
          volumeMounts:
            - name: data
              mountPath: /data
            - name: principal-pub
              mountPath: /etc/horus/principal
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: principal-pub
          secret:
            secretName: horus-principal-pub
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vault-writer
  labels:
    app.kubernetes.io/name: vault-writer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vault-writer
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-router
  labels:
    app.kubernetes.io/name: vault-router
    app.kubernetes.io/component: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-router
    spec:
      enableServiceLinks: false
      containers:
        - name: vault-router
          image: ghcr.io/arjunkhera/horus/vault-router:0.1.0-alpha
          ports:
            - containerPort: 8000
          env:
            # The router applies the read/write split from the vault-registry:
            # reads route to a namespace's reader_endpoint, writes to its
            # writer_endpoint (services/vault-router/src/registry.py). VAULT_ENDPOINTS
            # is the fallback name→url map (and the default namespace label) used when
            # no registry entry matches; it points at the reader pool.
            - name: VAULT_ENDPOINTS
              value: default=http://vault-reader.horus-system.svc.cluster.local:8000
            - name: VAULT_DEFAULT
              value: default
            # App defaults to 8400; pin to 8000 to match containerPort/Service/probe.
            - name: VAULT_ROUTER_PORT
              value: "8000"
            # vault-registry mounted as a file; router watches + live-reloads (#10).
            - name: VAULT_REGISTRY_PATH
              value: /etc/horus/vault-registry/registry.yaml
          volumeMounts:
            - name: vault-registry
              mountPath: /etc/horus/vault-registry
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: vault-registry
          configMap:
            name: vault-registry
---
apiVersion: v1
kind: Service
metadata:
  name: vault-router
  labels:
    app.kubernetes.io/name: vault-router
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vault-router
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
# vault-registry: namespace→endpoint routing table. The operator-service
# provisioner is the SOLE writer (RBAC); router + writer are read-only watchers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-registry
  labels:
    app.kubernetes.io/name: vault-registry
    app.kubernetes.io/managed-by: operator-service
data:
  registry.yaml: |
    # Seeded with the single alpha vault. operator-service is the runtime writer
    # (adds entries on multi-vault provisioning). The "default" namespace maps the
    # reader pool (vault-reader, 2 replicas) and the single writer (vault-writer) so
    # the router can apply the read/write split.
    vaults:
      default:
        reader_endpoint: http://vault-reader.horus-system.svc.cluster.local:8000
        writer_endpoint: http://vault-writer.horus-system.svc.cluster.local:8000
