# Non-secret service configuration. Secret material (keys, tokens, passwords)
# is delivered out-of-band — see deploy/secrets.example.yaml.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: horus-service-config
data:
  HORUS_SERVICE_TENANT: "default"
  HORUS_FORGE_REGISTRY_URL: "http://forge-registry.horus-system.svc.cluster.local:8080"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: operator-service-config
data:
  OPERATOR_TENANT: "default"
  OPERATOR_BOOTSTRAP_ADMIN: "admin"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
data:
  NEO4J_URI: "bolt://neo4j.horus-system.svc.cluster.local:7687"
  NEO4J_USER: "neo4j"
  TYPESENSE_HOST: "typesense.horus-system.svc.cluster.local"
  TYPESENSE_PORT: "8108"
