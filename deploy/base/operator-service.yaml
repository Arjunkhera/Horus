# operator-service — privileged provisioning. ClusterIP + port-forward only, NO ingress.
# B3: ServiceAccount + RBAC grants ConfigMap patch on vault-registry,
# env wires GitHub/Typesense/k8s config for real provisioning adapters.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: operator-service
  labels:
    app.kubernetes.io/name: operator-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: operator-service-registry-writer
  labels:
    app.kubernetes.io/name: operator-service
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["vault-registry"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: operator-service-registry-writer
  labels:
    app.kubernetes.io/name: operator-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: operator-service-registry-writer
subjects:
  - kind: ServiceAccount
    name: operator-service
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: operator-service
  labels:
    app.kubernetes.io/name: operator-service
    app.kubernetes.io/component: operator
spec:
  serviceName: operator-service
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: operator-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: operator-service
    spec:
      serviceAccountName: operator-service
      enableServiceLinks: false
      containers:
        - name: operator-service
          image: ghcr.io/arjunkhera/horus/operator-service:0.1.0-alpha.1
          ports:
            - containerPort: 8090
          env:
            # Trust the in-cluster API server CA so Node's fetch can call the
            # Kubernetes API (vault-registry ConfigMap read/patch) over TLS.
            # Without this, fetch fails with "self-signed certificate in chain".
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - name: OPERATOR_PORT
              value: "8090"
            - name: OPERATOR_DB_PATH
              value: /data/operator.db
            # B3: vault-registry ConfigMap target
            - name: VAULT_REGISTRY_CONFIGMAP
              value: vault-registry
            - name: VAULT_REGISTRY_NAMESPACE
              value: horus-system
            - name: VAULT_REGISTRY_KEY
              value: registry.yaml
            # B3: Typesense provisioning
            - name: TYPESENSE_URL
              value: http://typesense.horus-system.svc.cluster.local:8108
            - name: TYPESENSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vault-secrets
                  key: TYPESENSE_API_KEY
            # B3: GitHub repo provisioning (one repo per vault).
            # GITHUB_OWNER is the default org/user and is not a secret — it is a
            # plain account name. Override per-vault via vault_create payload.git_org.
            - name: GITHUB_OWNER
              value: "Arjunkhera"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-secrets
                  key: GITHUB_TOKEN
          envFrom:
            - configMapRef:
                name: operator-service-config
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: operator-service
  labels:
    app.kubernetes.io/name: operator-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: operator-service
  ports:
    - name: http
      port: 8090
      targetPort: 8090
---
# Privilege boundary: only the operator-service may be reached, and only from
# within the cluster (port-forward by the `horus operator` CLI). No ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: operator-service-deny-external
  labels:
    app.kubernetes.io/name: operator-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: operator-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: horus-system
