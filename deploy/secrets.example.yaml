# OUT-OF-BAND SECRETS — DO NOT COMMIT REAL VALUES. DO NOT add to kustomization.
#
# These are applied out-of-band (e.g. via sealed-secrets, SOPS, or `kubectl
# create secret`) AFTER operator-service first boot, which generates the
# keypairs. Wire the keys with the `horus operator init` helper, which fetches
# operator-service /keys/jwks:
#
#   1. operator-service boots → generates client-facing + internal keypairs (PVC).
#   2. `horus operator init` reads GET /keys/jwks (public halves) and the internal
#      signing key (out-of-band export) and produces these Secrets.
#   3. horus-service consumes the client public JWKS + internal SIGNING (private)
#      key; Vault consumes the internal PUBLIC jwk (verify X-Horus-Principal).
---
apiVersion: v1
kind: Secret
metadata:
  name: horus-service-secrets
  namespace: horus-system
type: Opaque
stringData:
  # JSON array of {kid, publicJwk} — verifies inbound client tokens.
  HORUS_CLIENT_JWKS_JSON: '[{"kid":"REPLACE","publicJwk":{}}]'
  # JSON {kid, alg, privateJwk} — mints the 60s internal X-Horus-Principal JWT.
  HORUS_INTERNAL_SIGNING_KEY_JSON: '{"kid":"REPLACE","alg":"ES256","privateJwk":{}}'
---
apiVersion: v1
kind: Secret
metadata:
  name: horus-principal-pub
  namespace: horus-system
type: Opaque
stringData:
  # Internal signing key PUBLIC half (JWK) — Vault verifies X-Horus-Principal.
  pub.jwk: '{"kty":"EC","crv":"P-256","x":"REPLACE","y":"REPLACE"}'
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-secrets
  namespace: horus-system
type: Opaque
stringData:
  NEO4J_AUTH: "neo4j/REPLACE"
  NEO4J_PASSWORD: "REPLACE"
  TYPESENSE_API_KEY: "REPLACE"
  # GitHub-backed knowledge repo provisioning. entrypoint.sh derives the HTTPS
  # clone URL as https://github.com/${GITHUB_REPO}.git and authenticates with
  # GITHUB_TOKEN: the writer clones + pushes knowledge PRs, readers clone + pull.
  # The repo must exist with an initial commit on GITHUB_BASE_BRANCH (default
  # master). Required — vault fails fast without a knowledge repo.
  GITHUB_TOKEN: "REPLACE"
  GITHUB_REPO: "owner/knowledge-repo"
---
apiVersion: v1
kind: Secret
metadata:
  name: forge-registry-secrets
  namespace: horus-system
type: Opaque
stringData:
  # Explicit IAM-user S3 credentials for the Forge artifact bucket. The registry
  # does NOT use an instance/IRSA profile (learnings/forge-registry-deploy-gotchas.md #5).
  FORGE_REGISTRY_S3_ACCESS_KEY_ID: "REPLACE"
  FORGE_REGISTRY_S3_SECRET_ACCESS_KEY: "REPLACE"
