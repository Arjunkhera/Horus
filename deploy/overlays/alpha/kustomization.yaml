apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: horus-system

commonLabels:
  app.kubernetes.io/part-of: horus-control-plane
  horus.dev/env: alpha

resources:
  - ../../base

# Alpha keeps base replica counts and pinned tags. Re-pin images here per release.
# horus-service re-pinned ahead of the rest: ships the anonymous forge-read
# change (EC2→K8s cutover, story 2828ffb7) without a full alpha re-tag.
# vault-router re-pinned to ship B3 multi-vault provisioning (PR #362, 6df2cec).
# vault + operator-service re-pinned to sha-031c6c8: B3 multi-vault provisioning
# end-to-end fixes found in Part B validation — payload-driven repo path +
# collision detection + GITHUB_OWNER default (PR #364), user-vs-org repo create
# (PR #365), registry YAML-parse (preserve default) + repo default-branch
# detection (PR #366). CA trust via NODE_EXTRA_CA_CERTS.
images:
  - name: ghcr.io/arjunkhera/horus/horus-service
    newTag: sha-d132db0
  - name: ghcr.io/arjunkhera/horus/vault
    newTag: sha-9c22ce7
  - name: ghcr.io/arjunkhera/horus/vault-router
    newTag: sha-6df2cec
  - name: ghcr.io/arjunkhera/horus/operator-service
    newTag: sha-031c6c8
