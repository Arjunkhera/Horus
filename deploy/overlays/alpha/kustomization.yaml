apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: horus-system

commonLabels:
  app.kubernetes.io/part-of: horus-control-plane
  horus.dev/env: alpha

resources:
  - ../../base

# Alpha keeps base replica counts and pinned tags. Re-pin images here per release.
# horus-service re-pinned ahead of the rest: ships the anonymous forge-read
# change (EC2→K8s cutover, story 2828ffb7) without a full alpha re-tag.
# vault-router re-pinned to ship B3 multi-vault provisioning (PR #362, 6df2cec).
# vault + operator-service re-pinned to sha-031c6c8: B3 multi-vault provisioning
# end-to-end fixes found in Part B validation — payload-driven repo path +
# collision detection + GITHUB_OWNER default (PR #364), user-vs-org repo create
# (PR #365), registry YAML-parse (preserve default) + repo default-branch
# detection (PR #366). CA trust via NODE_EXTRA_CA_CERTS.
# vault re-pinned to sha-e790daf: flat-UUID storage (bare-UUID id, pages/<uuid>.md)
# + full-body indexing + wiki-link auto-edges + typed inverse-labelled edges
# (Vault V3 / B3 Part C, PR #368).
# vault re-pinned to sha-ef4f314: token-less git remotes via credential-helper —
# fixes silent clone/push breakage on PAT rotation (bug 3a561b8b, PR #379).
# operator-service re-pinned to sha-de7df7e: reads GITHUB_TOKEN per-request from a
# mounted (hot-reloading) Secret volume instead of a frozen env var — fixes stale
# token / 401 Bad credentials after PAT rotation (bug 52f1cda8, PR #382).
# vault re-pinned to sha-b69a234: set HOME in the writer entrypoint so the runtime
# per-vault `git clone` finds the credential store — fixes 500 on writes to
# provisioned (private) vaults like vault-office (PR #417).
# vault re-pinned to sha-400a4fd: per-vault sync loop — the writer pulls +
# reindexes each provisioned vault clone on PR merge, so provisioned-vault pages
# become searchable (write -> merge -> searchable). Reverts the #419 index-on-write
# attempt, which search dropped because content wasn't on disk (PR #421).
# operator-service re-pinned to sha-6e608ea: configurable GitHub API base
# (GITHUB_API_HOST + per-request git_api_host) so the control plane can back
# vaults on GitHub Enterprise hosts, not just api.github.com (bug e4904a31, PR #435).
# vault-router re-pinned to sha-db78440: add GET/POST /vaults discovery endpoint
# backed by the live VaultRegistry, so clients can enumerate every served vault at
# call time (incl. vaults provisioned after their bundle was minted). Surfaced as
# the knowledge_list_vaults MCP tool (bug 281e98ed, Vault V3, PR #436).
# vault re-pinned to sha-47287c6: configurable git clone host — the reader/writer
# derive the clone remote + credential-store host from GITHUB_API_HOST, so the
# control plane can clone/serve vaults backed on GitHub Enterprise, completing the
# operator-service GHE fix (bug e4904a31, PR #439).
# vault re-pinned to sha-1e563e0: principal-gate WRITE endpoints only, not reads —
# fixes non-default-vault reads 401'ing at the writer pool (vault-router routes
# their reads to the writer, which mounts the principal JWK), which surfaced as
# empty search for provisioned vaults like vault-office (bug 281e98ed, PR #442).
# operator-service re-pinned to sha-8ea815b: adopt an existing backing store —
# vault_attach now derives git_repo deterministically and writes a COMPLETE,
# idempotent registry entry (new `horus operator vault adopt` CLI alias), so
# half-provisioned vaults like vault-office are recoverable without manual
# ConfigMap surgery (story 94099e71, bug 281e98ed, PR #446).
# vault + vault-router re-pinned to sha-ef7ae13: list-by-scope no longer 422s on
# limit>100 (writer clamps to 100) and the router no longer swallows a non-2xx
# fan-out response into an empty 200 — it surfaces per-vault errors (and 502s when
# all vaults fail), so callers can tell "empty" from "failed" (bug 90b09eb8, PR #449).
images:
  - name: ghcr.io/arjunkhera/horus/horus-service
    newTag: sha-d132db0
  - name: ghcr.io/arjunkhera/horus/vault
    newTag: sha-ef7ae13
  - name: ghcr.io/arjunkhera/horus/vault-router
    newTag: sha-ef7ae13
  - name: ghcr.io/arjunkhera/horus/operator-service
    newTag: sha-8ea815b
