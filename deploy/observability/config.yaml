# Prometheus scrape config + alert rules, and Alertmanager config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]
    rule_files:
      - /etc/prometheus/rules/*.yml
    scrape_configs:
      - job_name: horus-service
        metrics_path: /metrics
        static_configs:
          - targets: ["horus-service.horus-system.svc.cluster.local:8080"]
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
  rules.yml: |
    groups:
      - name: horus-control-plane
        rules:
          - alert: HorusServiceDown
            expr: up{job="horus-service"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "horus-service target is down"
          - alert: HorusServiceHigh5xx
            expr: |
              sum(rate(horus_service_requests_total{status=~"5.."}[5m]))
                / sum(rate(horus_service_requests_total[5m])) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "horus-service 5xx ratio above 5% for 5m"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
data:
  alertmanager.yml: |
    route:
      receiver: default
      group_by: ["alertname"]
    receivers:
      - name: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.horus-system.svc.cluster.local:9090
        isDefault: true
