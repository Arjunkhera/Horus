# sealed-secrets controller (A3 — encrypted secrets in Git).
# sync-wave -2: the controller must exist before any SealedSecret (wave -1) so
# the encrypted secrets can be unsealed into real Secrets before workloads start.
# Controller name is pinned to `sealed-secrets-controller` (kubeseal's default)
# so `kubeseal --controller-namespace sealed-secrets` works without extra flags.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.16.2
    helm:
      releaseName: sealed-secrets
      values: |
        fullnameOverride: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
