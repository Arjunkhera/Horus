# Sealed control-plane secrets (A3).
# sync-wave -1: the SealedSecrets must be applied (and unsealed by the
# controller into real Secrets) before the wave-0 workloads consume them.
# Starts as a no-op until the *.sealed.yaml files are committed post-provision.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: horus-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/arjunkhera/horus.git
    targetRevision: HEAD
    path: deploy/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: horus-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
