#         proxy_set_header X-User-Id   "";
#         proxy_set_header X-User-Name "";
#         proxy_set_header X-User-Role "";
#
#         # Inject verified identity from JWT claims.
#         # These values come from your JWT verification logic (e.g., lua vars).
#         proxy_set_header X-User-Id   $jwt_sub;
#         proxy_set_header X-User-Name $jwt_name;
#         proxy_set_header X-User-Role $jwt_role;
#
#         proxy_pass http://forge_registry;
#     }
# }
