apiVersion: testenv/v1
repo: fixture-secrets
requires:
  secrets:
    - TESTENV_REQUIRED_SECRET
phases:
  setup:
    steps:
      - run: "echo 'setup with secrets'"
    isolationChecks:
      allRequiredSecretsPresent: true
      disjointDockerProject: false
      disjointDockerNetworks: false
      disjointDockerVolumes: false
      disjointPortSpace: false
      disjointDataDir: false
  launch:
    provisioner: "echo 'launch ok'"
  await_ready:
    poll:
      - probe: "health_check"
        expect: "ok"
    timeout: 5
    interval: 1
  connection:
    emit: "/tmp/testenv-secrets-settings.json"
  test:
    policy: fail-fast
    actions:
      - name: echo-ok
        invoke:
          run: "echo 'ok'"
        expect:
          exitCode: 0
        # needsStack: true (default) — forces Phase-1 secrets check to run
        needsStack: true
  teardown:
    provisioner: "echo 'teardown'"
    isolationChecks:
      liveStackUnmodified: true
      liveDataTestArtifactsZero: true
      noSecretResidue: true
